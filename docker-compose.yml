version: "3.7"
services:
  spring:
    build:
      context: ./backend/jodel
      dockerfile: Dockerfile
    container_name: spring
    volumes:
      - "./backend/jodel:/app"
      - ~/.m2:/root/.m2
    ports:
      - "8082:8082"
    environment:
      - POSTGRES_USER=jodel
      - POSTGRES_PASSWORD=jodel
      - POSTGRES_DB=jodel
    command: "spring-boot:run"      
    depends_on:
      - spring-db 
    networks:
      - local
  
  spring-db:
    container_name: spring-db
    image: "postgres:12"
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=jodel
      - POSTGRES_PASSWORD=jodel
      - POSTGRES_DB=jodel
    networks:
      - local
  web:
    build: 
      context: ./frontend/jodelui
    develop:
      watch:
        - path: ./frontend/jodelui
          target: /app
          action: sync
    command: "npm start" 
    ports:
      - 3000:3000
    networks:
      - local

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:22.0.0
    command: ['start-dev', '--import-realm']
    environment:
      KEYCLOAK_ADMIN: jodel
      KEYCLOAK_ADMIN_PASSWORD: password
      KC_HEALTH_ENABLED: 'true'
      KC_HTTP_ENABLED: 'true'
      KC_METRICS_ENABLED: 'true'
      KC_HOSTNAME_URL: http://keycloak:8180
      KC_HTTP_PORT: 8180
      KC_PROXY: reencrypt
      KEYCLOAK_IMPORT: /opt/keycloak/data/import/
    ports:
      - "8180:8180"
      - "8787:8787"  # Debug-Port
    volumes:
      - ./keycloak/customTheme:/opt/keycloak/themes/customTheme
      - ./keycloak/data:/opt/keycloak/data/import
    networks:
      - local
      

networks:
  local:


