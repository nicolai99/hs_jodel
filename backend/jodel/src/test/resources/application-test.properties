spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

logging.level.root=ERROR
logging.level.org.springframework.boot.test.context.SpringBootTest=ERROR

logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql=ERROR

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect


spring.jpa.defer-datasource-initialization=true



spring.sql.init.mode=always
spring.jpa.properties.hibernate.format_sql=true

spring.security.oauth2.resourceserver.jwt.issuer-uri: http://keycloak:8180/realms/jodel
spring.security.oauth2.resourceserver.jwt.jwk-set-uri: http://keycloak:8180/realms/jodel/protocol/openid-connect/certs